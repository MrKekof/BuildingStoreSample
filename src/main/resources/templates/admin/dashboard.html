<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head>
    <title>BuildingStore Admin | Dashboard</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom border-dark border-opacity-10">
            <h1 class="h2 fw-bold text-light">Dashboard</h1>
        </div>

        <!-- Quick Stats -->
        <div class="row g-4 mb-4">
            <div class="col-xl-4 col-md-6">
                <div class="card-glass stat-card p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-light text-uppercase mb-1 fw-bold">Active Products</h6>
                            <h3 class="mb-0 fw-bold">Manage Catalog</h3>
                        </div>
                        <div class="stat-icon bg-primary bg-opacity-10 text-primary rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                            <i class="bi bi-box-seam fs-3"></i>
                        </div>
                    </div>
                    <div class="mt-4">
                        <a th:href="@{/admin/catalog}" class="btn btn-sm btn-outline-primary text-decoration-none">Go to Catalog <i class="bi bi-arrow-right ms-1"></i></a>
                    </div>
                </div>
            </div>

            <div class="col-xl-4 col-md-6">
                <div class="card-glass stat-card p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-light text-uppercase mb-1 fw-bold">Published News</h6>
                            <h3 class="mb-0 fw-bold">Manage News</h3>
                        </div>
                        <div class="stat-icon bg-success bg-opacity-10 text-success rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                            <i class="bi bi-newspaper fs-3"></i>
                        </div>
                    </div>
                    <div class="mt-4">
                        <a th:href="@{/admin/news}" class="btn btn-sm btn-outline-success text-decoration-none">Go to News <i class="bi bi-arrow-right ms-1"></i></a>
                    </div>
                </div>
            </div>

            <div class="col-xl-4 col-md-6">
                <div class="card-glass stat-card p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-light text-uppercase mb-1 fw-bold">CMS Pages</h6>
                            <h3 class="mb-0 fw-bold">Manage Pages</h3>
                        </div>
                        <div class="stat-icon bg-warning bg-opacity-10 text-warning rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                            <i class="bi bi-file-earmark-text fs-3"></i>
                        </div>
                    </div>
                    <div class="mt-4">
                        <a th:href="@{/admin/pages}" class="btn btn-sm btn-outline-warning text-decoration-none">Go to Pages <i class="bi bi-arrow-right ms-1"></i></a>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
           <div class="col-12">
               <div class="card-glass p-4 text-center py-5">
                   <i class="bi bi-building text-primary opacity-50 mb-3 d-block" style="font-size: 4rem;"></i>
                   <h2 class="text-light fw-bold">Welcome to BuildingStore Admin</h2>
                   <p class="text-muted mb-0 mx-auto" style="max-width: 600px;">
                       Manage everything from products, CMS pages, to store news in one organized place. Select an option from the sidebar to begin.
                   </p>
               </div>
           </div>
        </div>
    </div>
</body>
</html>
