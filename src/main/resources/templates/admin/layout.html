<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? 'BuildingStore Admin | ' + title : 'BuildingStore Admin'}">BuildingStore Admin</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- SweetAlert2 Dark Theme -->
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@5.0.18/dark.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="dark-theme">
    
    <div class="d-flex wrapper">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3><i class="bi bi-building fs-4 me-2"></i>BuildingStore</h3>
            </div>
            <ul class="list-unstyled components">
                <li th:class="${title == 'Dashboard'} ? 'active' : ''">
                    <a th:href="@{/admin}"><i class="bi bi-speedometer2"></i> Dashboard</a>
                </li>
                <li th:class="${title == 'Catalog Management'} ? 'active' : ''">
                    <a th:href="@{/admin/catalog}"><i class="bi bi-box-seam"></i> Catalog</a>
                </li>
                <li th:class="${title == 'News Management'} ? 'active' : ''">
                    <a th:href="@{/admin/news}"><i class="bi bi-newspaper"></i> News</a>
                </li>
                <li th:class="${title == 'Page Management'} ? 'active' : ''">
                    <a th:href="@{/admin/pages}"><i class="bi bi-file-earmark-text"></i> Pages</a>
                </li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content" class="w-100 flex-grow-1">
            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg navbar-dark bg-glass border-bottom border-dark border-opacity-10 mb-4 px-4 sticky-top">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-primary d-lg-none">
                        <i class="bi bi-list"></i>
                    </button>
                    <h5 class="navbar-brand ms-3 mb-0" th:text="${title}">Dashboard</h5>
                    <div class="ms-auto d-flex align-items-center">
                         <div class="dropdown">
                            <a class="nav-link dropdown-toggle text-light" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <img src="https://ui-avatars.com/api/?name=Admin&background=random" alt="Admin" class="rounded-circle" width="32" height="32">
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 border-dark border-opacity-10 admin-dropdown">
                                <li><h6 class="dropdown-header">Administrator</h6></li>
                                <li><hr class="dropdown-divider border-dark border-opacity-10"></li>
                                <li><a class="dropdown-item" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2"></i>Exit Admin</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- Main Content Area -->
            <main class="container-fluid px-4 main-content-area" layout:fragment="content">
                <!-- Content injected here -->
            </main>
            
            <!-- Footer -->
            <footer class="mt-5 py-3 text-center text-muted small bg-glass border-top border-dark border-opacity-10">
                &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> BuildingStore Admin. All rights reserved.
            </footer>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.all.min.js"></script>
    
    <!-- Custom JS -->
    <script th:src="@{/js/admin.js}"></script>
    
    <!-- Layout-specific JS -->
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
